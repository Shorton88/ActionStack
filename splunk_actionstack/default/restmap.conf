[script:actionstack]
match = /actionstack
script = actionstack_handler.py
scripttype = persist
handler = actionstack_handler.ActionStackHandler
# Required by AppInspect and Splunk releases without python.required support.
python.version = python3.9
python.required = 3.9, 3.13
requireAuthentication = true
passSystemAuth = true
passPayload = true
output_modes = json
capability = actionstack_use
