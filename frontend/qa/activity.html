<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Automation activity · local QA fixture</title></head>
<body style="margin:0"><div class="actionstack-app" style="display:block;padding:24px"><main style="max-width:660px;margin:auto">
<h1>Local QA fixture</h1><p>Fictional runs. No connection to SOAR.</p>
<label>Scenario <select id="scenario"><option value="running">Running</option><option value="failed">Failed</option><option value="partial">Partial permissions</option></select></label>
<p id="requests">Status requests: 0</p><button id="close" class="button">Close status panel</button><div id="activity"></div>
</main></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { AutomationActivity } from '/src/AutomationActivity.tsx';
import '/src/styles.css';
let requests = 0;
const originalFetch = window.fetch;
window.fetch = async (url, init) => {
  if (url !== '/api/submissions/qa/activity') return originalFetch(url, init);
  document.querySelector('#requests').textContent = 'Status requests: ' + (++requests);
  const scenario = document.querySelector('#scenario').value;
  const status = scenario === 'failed' ? 'failed' : 'running';
  const run = (id,name,status,playbook_run_id=null) => ({id,name,status,playbook_run_id,updated_at:null});
  const group = (items,error=null) => ({items,total:items.length,truncated:false,error});
  return new Response(JSON.stringify({data:{
    checked_at:new Date().toISOString(),automation_enabled:true,demo:true,
    playbooks:group([run(41,'local/block_object',status)]),
    actions:scenario === 'partial' ? group([], 'The SOAR identity cannot read these runs.') : group([
      {...run(42,'lookup domain','success',41),summaries:[{app_run_id:51,status:'success',summary:{verdict:'malicious',matches:2},data:[{domain:'example.test',verdict:'malicious'}]}]},
      {...run(43,'lookup user',status,41),summaries:[{app_run_id:52,status:status,data:[{identity:'alice@example.test',display_name:'Alice Example',groups:['Engineering','Support'],note:'<script>fictional text, never executed<\/script>'}],data_truncated:true}]},
      {...run(44,'lookup empty result','success',41),summaries:[{app_run_id:53,status:'success',data:[]}]}
    ])
  }}),{headers:{'Content-Type':'application/json'}});
};
const root=createRoot(document.querySelector('#activity'));
root.render(React.createElement(AutomationActivity,{id:'qa',containerId:17,enabled:true}));
document.querySelector('#close').onclick = () => root.unmount();
</script></body></html>
