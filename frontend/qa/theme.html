<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Theme and catalog · local QA</title>
  </head>
  <body style="margin: 0" class="dashboard-body">
    <div id="actionstack-root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { WorkspaceEditor } from "/src/Management.tsx";
      import { Catalog } from "/src/Catalog.tsx";
      import "/src/styles.css";
      // Mimic dark Splunk host typography loading after app styles.
      const host = document.createElement("style");
      host.textContent =
        ".dashboard-body h1,.dashboard-body h2,.dashboard-body h3 {color:white} .dashboard-body label {color:#bcc5d5} .dashboard-body code {background:#f5f5f5;border:1px solid #ddd;color:#c7254e}";
      document.head.append(host);
      const h = React.createElement;
      function Fixture() {
        const [theme, setTheme] = React.useState("light");
        const [screen, setScreen] = React.useState("setup");
        const [favorites, setFavorites] = React.useState([]);
        const forms = [
          "Employee onboarding",
          "Request access",
          "Device inventory",
        ].map((title, i) => ({
          id: "fixture-" + i,
          title,
          description:
            "Share the details with your team and follow the progress of your request.",
          category: "Team services",
          owner: "Operations",
          accent: ["violet", "cyan", "rose"][i],
          icon: ["workflow", "shield", "search"][i],
        }));
        return h(
          "div",
          {
            className: "actionstack-app",
            "data-theme": theme,
            style: { display: "block", minHeight: "100vh", padding: 32 },
          },
          h(
            "div",
            { style: { display: "flex", gap: 16, marginBottom: 24 } },
            h(
              "label",
              null,
              "Theme ",
              h(
                "select",
                { value: theme, onChange: (e) => setTheme(e.target.value) },
                h("option", null, "light"),
                h("option", null, "dark"),
              ),
            ),
            h(
              "label",
              null,
              "Screen ",
              h(
                "select",
                { value: screen, onChange: (e) => setScreen(e.target.value) },
                h("option", null, "setup"),
                h("option", null, "catalog"),
              ),
            ),
          ),
          screen === "setup"
            ? h(
                "main",
                { style: { maxWidth: 1080, margin: "auto" } },
                h(
                  "div",
                  { className: "page-heading" },
                  h("h1", null, "Set up your team"),
                  h(
                    "p",
                    null,
                    "Local visual fixture. No workspace or SOAR changes.",
                  ),
                ),
                h(WorkspaceEditor, {
                  ctx: {
                    can_create_roles: true,
                    roles_available: [
                      "as_operations_viewer",
                      "as_operations_user",
                      "as_operations_admin",
                      "existing_team_role",
                    ],
                  },
                  onSaved: () => {},
                }),
              )
            : h(Catalog, {
                forms,
                favorites,
                busy: false,
                onFavorite: (f) =>
                  setFavorites(
                    favorites.includes(f.id)
                      ? favorites.filter((id) => id !== f.id)
                      : [...favorites, f.id],
                  ),
                onOpen: () => {},
                onCreate: () => {},
              }),
        );
      }
      // Never send setup mutations from this visual fixture.
      window.fetch = async () =>
        new Response(
          JSON.stringify({ error: { message: "Visual fixture only." } }),
          { status: 400 },
        );
      createRoot(document.getElementById("actionstack-root")).render(
        h(Fixture),
      );
    </script>
  </body>
</html>
